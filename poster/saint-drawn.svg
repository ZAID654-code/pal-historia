      <stop offset="0" stop-color="#f7d774"/><stop offset=".5" stop-color="#d9a826"/><stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
