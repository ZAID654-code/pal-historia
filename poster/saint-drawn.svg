    <path d="M395 492 C350 505 300 500 270 482 C240 465 210 480 200 500" stroke="#7bc96f" stroke-width="7" fill="none" stroke-dasharray="6 6"/>
    <path d="M300 470 L280 425 L305 445 L310 415 L322 452 Z" fill="#14532d"/>
    <path d="M270 482 C285 470 300 455 318 440" stroke="#1f6b3a" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M310 430 L352 420 L360 432 L338 436 L362 446 L350 452 L318 452 Z" fill="#1f6b3a" stroke="#0f3d22" stroke-width="2"/>
    <path d="M338 436 L362 446 L350 452 Z" fill="#b91c1c"/>
    <circle cx="330" cy="430" r="3" fill="#facc15"/>
